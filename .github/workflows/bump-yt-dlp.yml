name: Bump yt-dlp

on:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump yt-dlp in requirements.txt
        id: bump
        working-directory: backend
        run: |
          python -m pip install -U pip yt-dlp
          VER=$(python -c "import yt_dlp,re; print(yt_dlp.version.__version__)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          from pathlib import Path
          import yt_dlp
          ver = yt_dlp.version.__version__
          path = Path("requirements.txt")
          lines = []
          for line in path.read_text().splitlines():
              if line.startswith("yt-dlp"):
                  lines.append(f"yt-dlp>={ver}")
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          print("set yt-dlp>=", ver)
          PY

      - name: Smoke import + unit tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import yt_dlp; from app.main import app; print('ok', app.title)"
          pytest -q

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(backend): bump yt-dlp to ${{ steps.bump.outputs.version }}"
          title: "chore: bump yt-dlp to ${{ steps.bump.outputs.version }}"
          body: |
            Automated weekly bump of `yt-dlp` to keep pace with YouTube changes.
            Includes import smoke test and unit tests.
          branch: chore/bump-yt-dlp
          delete-branch: true
