name: Keepalive Render backend

on:
  schedule:
    # Every 12 minutes — keeps Render Free from sleeping
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "BACKEND_HEALTH_URL secret is not set"
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$BACKEND_HEALTH_URL"
          echo
          echo "OK"
